[package]
name = "fuxian"
version = "0.2.1"
description = "伏线 · 本地小说工作台"
edition = "2021"

[lib]
name = "fuxian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
rfd = "0.15"

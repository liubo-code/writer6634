[package]
name = "fuxian"
version = "0.1.0"
description = "伏线 · 私人小说工作台"
authors = ["liubo-code"]
edition = "2021"

[lib]
name = "fuxian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
